version: '3.8'

services:
  mortgage-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mortgage-calculator
    stop_grace_period: 1s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mortgage.rule=Host(`mortgage.geekynavigator.com`)"
      - "traefik.http.routers.mortgage.tls=true"
      - "traefik.http.services.mortgage.loadbalancer.server.port=80"
      - "traefik.http.routers.mortgage.tls.certresolver=cloudflare"
      - "traefik.docker.network=mortgage_network"
    networks:
      - mortgage_network
    restart: always

networks:
  mortgage_network:
    external: true 