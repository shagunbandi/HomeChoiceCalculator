version: '3.8'

services:
  # Development service (optional - keep if you need it for local development)
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev
    # Not connected to the external network since it's only for local development

networks:
  mortgage_network:
    external: true 